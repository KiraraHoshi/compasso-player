# Monta o arquivo .aab da Google Play, assinado com a chave de envio.
# Roda só quando você pedir: aba Actions -> "App Android (loja)" -> Run workflow.
# Precisa dos segredos OROLON_CHAVE_BASE64, OROLON_CHAVE_SENHA e OROLON_CHAVE_ALIAS (veja ANDROID.md).
name: App Android (loja)

on:
  workflow_dispatch:
    inputs:
      ensaio:
        description: "Ensaio: usa uma chave descartável só para testar se o build funciona (o .aab não serve para a loja)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Conferir os segredos
        env:
          B64: ${{ secrets.OROLON_CHAVE_BASE64 }}
          SENHA: ${{ secrets.OROLON_CHAVE_SENHA }}
          ALIAS: ${{ secrets.OROLON_CHAVE_ALIAS }}
        run: |
          if [ "${{ inputs.ensaio }}" = "true" ]; then echo "Ensaio com chave descartável"; exit 0; fi
          if [ -z "$B64" ] || [ -z "$SENHA" ] || [ -z "$ALIAS" ]; then
            echo "::error::Faltam os segredos da chave (OROLON_CHAVE_BASE64, OROLON_CHAVE_SENHA, OROLON_CHAVE_ALIAS). Veja ANDROID.md."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar o Capacitor
        run: npm install --no-audit --no-fund

      - name: Montar o projeto Android
        run: |
          npm run www
          npx cap add android
          node scripts/permissoes-android.mjs
          cp -r android-assets assets
          npx @capacitor/assets generate --android --iconBackgroundColor "#14111F" --iconBackgroundColorDark "#14111F" --splashBackgroundColor "#14111F" --splashBackgroundColorDark "#14111F"
          npx cap sync android

      - name: Colocar a chave de envio
        env:
          B64: ${{ secrets.OROLON_CHAVE_BASE64 }}
        run: |
          if [ "${{ inputs.ensaio }}" = "true" ]; then
            keytool -genkeypair -keystore android/orolon-envio.jks -storetype PKCS12 -storepass ensaio123 -keypass ensaio123 -alias ensaio -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Ensaio"
          else
            echo "$B64" | base64 -d > android/orolon-envio.jks
          fi
          node scripts/chave-loja-android.mjs | tee versao.txt
          echo "VERSAO=$(grep -oP 'const VERSAO = "\K[0-9.]+' js/app.js)" >> "$GITHUB_ENV"

      - name: Gerar o .aab assinado
        env:
          OROLON_CHAVE_SENHA: ${{ inputs.ensaio && 'ensaio123' || secrets.OROLON_CHAVE_SENHA }}
          OROLON_CHAVE_ALIAS: ${{ inputs.ensaio && 'ensaio' || secrets.OROLON_CHAVE_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "../Orolon-${VERSAO}.aab"
          rm -f orolon-envio.jks

      - uses: actions/upload-artifact@v4
        with:
          name: Orolon-${{ env.VERSAO }}-${{ inputs.ensaio && 'ensaio' || 'google-play' }}
          path: Orolon-*.aab
          retention-days: 30
