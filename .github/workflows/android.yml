# Monta o app Android do Orolon com Capacitor, no próprio GitHub (nada precisa ser instalado no seu PC).
# Cada envio para a main gera um APK de teste, publicado na página de Releases como "Android (teste)".
name: App Android

on:
  push:
    branches: [main]
    paths: ["index.html", "css/**", "js/**", "icons/**", "temas/**", "manifest.json", "android-assets/**", "capacitor.config.json", "package.json", "scripts/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar o Capacitor
        run: npm install --no-audit --no-fund

      - name: Montar o projeto Android
        run: |
          npm run www
          npx cap add android
          cp -r android-assets assets
          npx @capacitor/assets generate --android --iconBackgroundColor "#14111F" --iconBackgroundColorDark "#14111F" --splashBackgroundColor "#14111F" --splashBackgroundColorDark "#14111F"
          npx cap sync android

      - name: Versão do app
        run: |
          VERSAO=$(grep -oP 'const VERSAO = "\K[0-9.]+' js/app.js)
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSAO\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Gerar o APK de teste
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../Orolon-${VERSAO}-teste.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Orolon-${{ env.VERSAO }}-teste
          path: Orolon-*-teste.apk

      - name: Tirar os APKs de versões anteriores da página
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/android-teste" --jq ".assets[] | select(.name != \"Orolon-${VERSAO}-teste.apk\") | .id" 2>/dev/null \
            | while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"; done || true

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-teste
          name: Android (teste)
          prerelease: true
          make_latest: false
          files: Orolon-*-teste.apk
          body: |
            APK de teste do Orolon Player ${{ env.VERSAO }} (build ${{ github.run_number }}).
            No celular: baixe o arquivo .apk abaixo e abra. O Android pede para permitir a instalação de apps desta fonte.
            Esta versão é só para testar; a da Google Play vai ser assinada com a chave oficial.
